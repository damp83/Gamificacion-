# Publica la plataforma en GitHub Pages en cada push a la rama principal.
#
# No hay compilación: el repositorio ES el sitio. index.html está en la raíz y
# todas las rutas son relativas, así que funciona igual en la subcarpeta que
# usa Pages (usuario.github.io/repositorio/).
name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/new-session-5sbfxo, main]
  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos cambios seguidos, que gane el último y no se pisen
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement: true` intenta activar Pages solo, sin pasar por Ajustes.
      # Si la cuenta no se lo permite, este paso falla y hay que activarlo a
      # mano una vez (Settings → Pages → Source: GitHub Actions).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
